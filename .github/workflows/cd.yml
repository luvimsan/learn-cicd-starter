on:
  push:
    branches: [main]


jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Build the app
        run: |
          chmod +x ./scripts/buildprod.sh
          ./scripts/buildprod.sh
